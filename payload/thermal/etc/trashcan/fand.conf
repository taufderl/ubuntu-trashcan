# trashcan-fand settings (shell syntax). Temperatures in degrees C.
# The fan floor ramps linearly from the SMC minimum at *_LOW to the
# maximum at *_HIGH; the hotter of CPU and GPU wins.
INTERVAL=2
CPU_LOW=50
CPU_HIGH=80
GPU_LOW=55
GPU_HIGH=85
# How fast the floor may drop, in rpm per interval (avoids fan hunting).
RAMP_DOWN=50
